# The `pulsar.voxel` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.voxel"
name = "Voxel Worlds"
description = "Destructible voxel terrain: its components, runtime, file formats, ready-made worlds and the renderer feature that draws it"
enabled_by_default = true
# None: the kinds a voxel world composes (sky, haze, wind, ground cover, sun,
# look) are reached by class name and component method; without one, a world
# simply has no such instance.
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "voxel_plugin"
