[package]
name = "voxel_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Voxel Worlds (`pulsar.voxel`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the sculpt and terrain tool modes, the stroke
# interaction, the save hook, the generator follow-up, the terrain's camera
# framing) and the crates they need. A game links the root without it, so it
# takes no editor dependency.
editor = ["dep:voxel_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
inventory = { workspace = true }
# The plugin's crates.
voxel_component = { workspace = true }
voxel_editor = { workspace = true, optional = true }
helio-pass-voxel-planet = { workspace = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
helio_component = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_settings = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

# The editor's headless viewport renderer, for voxel terrain work
# (`cargo run --release -p voxel_plugin --example voxel_editor_harness`).
[[example]]
name = "voxel_editor_harness"
path = "tools/voxel_editor_harness.rs"

# The voxel inspectors in the shared inspector: the editor's.
[[test]]
name = "inspector"
required-features = ["editor"]

[dev-dependencies]
# The plugin's integration tests (`tests/`) and the harness: the plugin as a
# game links it, with the kinds a voxel world composes (sky, haze, wind,
# ground cover, sun, look) linked through their roots; their component
# crates for the instances the tests compare.
fog_plugin = { workspace = true }
foliage_plugin = { workspace = true }
lights_plugin = { workspace = true }
post_plugin = { workspace = true }
sky_plugin = { workspace = true }
lights_component = { workspace = true }
fog_component = { workspace = true }
post_component = { workspace = true }
foliage_component = { workspace = true }
sky_component = { workspace = true }
# Their rows, which the tests compare the composed instances with.
helio-pass-volumetric-fog = { workspace = true }
helio-pass-sky = { workspace = true }
helio-pass-foliage-place = { workspace = true }
helio = { workspace = true }
helio-voxel-data = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scene_model = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
serde_json = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
pollster = "=0.4.0"
parking_lot = { workspace = true }
engine_state = { workspace = true }
image = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The inspector tests (`tests/inspector.rs`): the shared inspector and a
# headless window.
gpui-ce = { workspace = true, features = ["test-support"] }
ui = { workspace = true }
ui_common = { workspace = true }

[lints]
workspace = true
