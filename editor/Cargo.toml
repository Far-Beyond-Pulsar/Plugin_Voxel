[package]
name = "voxel_editor"
version = "0.1.0"
edition = "2024"
description = "Voxel worlds (pulsar.voxel): the editor crate -- the voxel terrain's inspector editors and the level editor's voxel tools, over the plugin's component crate; the plugin's root crate registers the tools"

[lib]
name = "voxel_editor"

[dependencies]
voxel_component = { workspace = true }
helio-pass-voxel-planet = { workspace = true }
helio_component = { workspace = true }
# The property editors' GPUI-typed prims (as helio-component).
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
ui = { workspace = true }
serde_json = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
rust-i18n = { workspace = true }
ui_common = { workspace = true }
engine_backend = { workspace = true }
glam = { workspace = true }
pulsar_scenedb = { workspace = true }
tracing = { workspace = true }
profiling = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The unit tests register `VoxelTerrainComponent`'s class themselves (`lib.rs`).
pulsar_world_registry = { workspace = true }

[lints]
workspace = true
