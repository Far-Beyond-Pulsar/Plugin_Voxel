[package]
name = "helio-voxel-world"
version = "0.1.0"
edition = "2021"
description = "Destructible voxel worlds, the data: grid, terrain generators, edits, queries, planet maps and features, mirrored bit for bit by WGSL. No GPU."
license = "MIT OR Apache-2.0"

[dependencies]
glam = { version = "0.33", features = ["bytemuck"] }
# `min_const_generics`: Pod arrays of any length (the landform plan), named
# here so the crate builds on its own, not only where another crate turns it on.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.1"
# Brush baking and coarse rebuilds across cores (`edit_store`).
rayon = "1.12"
# Query workers run on the host's task system.
helio-tasks = { workspace = true }

[dev-dependencies]
# examples/planet_map.rs writes the maps as PNGs.
image = { workspace = true }

[lints]
workspace = true
