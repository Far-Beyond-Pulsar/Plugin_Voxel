[package]
name = "voxel_component"
version = "0.1.0"
edition = "2024"
description = "Voxel worlds (pulsar.voxel): the voxel terrain components, their methods and runtime, the voxel file formats, ready-made worlds, and the plugin's Helio feature set; the plugin's root crate registers them"

[lib]
name = "voxel_component"

[dependencies]
engine_class_derive = { workspace = true }
# Enum properties get a dropdown editor, which needs the GPUI-typed prims (as helio-component).
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
# The `Reflectable` derive's generated enum dropdowns name `gpui`.
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scene_model = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_events = { workspace = true }
pulsar_class = { workspace = true }
helio_component = { workspace = true }
# Ready-made worlds are levels (`presets`); the feature's settings resolve
# through the project's. The game's slim feature set (as pulsar_game):
# linking the plugin must not pull the editor's features into a game build.
# A path dependency because the workspace table cannot opt out of default
# features.
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
helio-settings = { workspace = true }
# The plugin's api (data formats) and feature crates.
helio-voxel-data = { workspace = true }
helio-pass-voxel-planet = { workspace = true }

[lints]
workspace = true
